<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mauccounting ERP System Report</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202b3c;font:14px Arial,sans-serif;padding:26px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.muted{color:#8993a5;font-size:12px}.title{font-size:23px;font-weight:700;margin:5px 0}.actions{display:flex;gap:8px}button{border:1px solid #dce2ec;background:#fff;border-radius:7px;padding:9px 13px;cursor:pointer}.primary{background:#315efb;color:#fff;border-color:#315efb}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.filters label{font-size:11px;color:#68758a;display:grid;gap:5px}input,select{padding:9px;border:1px solid #dce2ec;border-radius:6px;background:#fff;min-width:150px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #e8ecf2;border-radius:9px;padding:16px}.stat span{display:block;color:#8993a5;font-size:11px}.stat b{display:block;font-size:20px;margin-top:8px}.panel{background:#fff;border:1px solid #e8ecf2;border-radius:9px;padding:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf0f5;font-size:12px}th{background:#f8f9fc;color:#68758a;position:sticky;top:0}.right{text-align:right}.empty{text-align:center;color:#8993a5;padding:25px}.error{padding:18px;background:#fff4f2;border:1px solid #ffd6cf;border-radius:8px;color:#a33}@media print{body{padding:0;background:#fff}.actions,.filters{display:none}.panel,.stat{border:1px solid #ddd}}@media(max-width:600px){body{padding:14px}.head{display:block}.actions{margin-top:12px}}
</style></head><body><div class="head"><div><div class="muted" id="company">Mauccounting ERP System</div><div class="title" id="reportTitle">Report</div><div class="muted">Currency: <span id="currency">PHP</span></div></div><div class="actions"><button id="csvBtn">Export CSV</button><button id="printBtn" class="primary">Print</button></div></div><div id="filters" class="filters"></div><div id="stats" class="stats"></div><section class="panel" id="reportBody">Loading report...</section><script type="module">
import {init,rows,num,money,dateVal,byId,active,esc} from "./report-core.js";
init("Collections Register",({rows,cur,company})=>{

const cust=byId(rows("Customers"),"CustomerID"), banks=byId(rows("Banks"),"BankID"), cash=byId(rows("CashAccounts"),"CashAccountID");const out=rows("CustomerPayments").map(x=>({date:dateVal(x.PaymentDate),no:x.PaymentNo,customer:cust[String(x.CustomerID)]?.CustomerName||x.CustomerID,method:x.PaymentMethod||"",account:banks[String(x.BankID)]?.BankName||cash[String(x.CashAccountID)]?.CashAccountName||"",ref:x.ReferenceNo||"",amount:num(x.Amount),memo:x.Memo||""}));return {filename:"collections-register",stats:[{label:"Collections",value:out.length},{label:"Total Collected",value:out.reduce((s,x)=>s+x.amount,0),money:true}],columns:[{key:"date",label:"Date"},{key:"no",label:"Receipt No."},{key:"customer",label:"Customer"},{key:"method",label:"Method"},{key:"account",label:"Deposit Account"},{key:"ref",label:"Reference"},{key:"amount",label:"Amount",money:true},{key:"memo",label:"Memo"}],rows:out};

});
</script></body></html>
