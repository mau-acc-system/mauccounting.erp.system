
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart of Accounts | Mauccounting ERP System</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 28px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fa;
    color: #26364e;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.heading h2 {
    margin: 0 0 7px;
    font-size: 23px;
}

.heading p {
    margin: 0;
    color: #8993a5;
    font-size: 13px;
}

button {
    cursor: pointer;
    font-family: inherit;
}

.primary-btn {
    border: 0;
    border-radius: 6px;
    background: #315efb;
    color: white;
    padding: 11px 18px;
    font-size: 12px;
    font-weight: bold;
}

.primary-btn:hover {
    background: #244bd2;
}

.panel {
    background: white;
    border: 1px solid #e8ecf2;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border: 1px solid #e8ecf2;
    border-radius: 9px;
    padding: 17px;
}

.stat-label {
    font-size: 11px;
    color: #8993a5;
}

.stat-value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 9px;
}

.toolbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) 220px 140px;
    gap: 10px;
    margin-bottom: 18px;
}

input, select, textarea {
    width: 100%;
    min-height: 40px;
    border: 1px solid #dce2eb;
    border-radius: 6px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    background: white;
    color: #26364e;
}

input:focus, select:focus, textarea:focus {
    border-color: #315efb;
    box-shadow: 0 0 0 3px rgba(49,94,251,.08);
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
}

thead {
    background: #f3f5f9;
}

th {
    padding: 13px 12px;
    text-align: left;
    color: #65748b;
    font-size: 11px;
    white-space: nowrap;
}

td {
    padding: 13px 12px;
    border-bottom: 1px solid #edf0f5;
    font-size: 12px;
}

tr:hover td {
    background: #fafbfe;
}

.account-code {
    font-weight: bold;
    color: #315efb;
}

.type-badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 5px;
    background: #edf2ff;
    color: #315efb;
    font-size: 10px;
    font-weight: bold;
}

.status-active {
    color: #16834b;
    font-weight: bold;
}

.status-inactive {
    color: #c03939;
    font-weight: bold;
}

.table-action {
    border: 0;
    background: transparent;
    color: #315efb;
    font-size: 11px;
    font-weight: bold;
    margin-right: 9px;
}

.table-action.danger {
    color: #d04444;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #8993a5;
}

.message {
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 18px;
}

.message.success {
    display: block;
    background: #e8f8ef;
    color: #16834b;
}

.message.error {
    display: block;
    background: #fff0f0;
    color: #c03939;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(12, 24, 44, .55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 10px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.15);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.modal-header h3 {
    margin: 0;
    font-size: 17px;
}

.close-btn {
    border: 0;
    background: transparent;
    font-size: 24px;
    color: #8993a5;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 17px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font-size: 11px;
    font-weight: bold;
    color: #536176;
}

textarea {
    min-height: 75px;
    resize: vertical;
}

.readonly {
    background: #f3f5f9;
    color: #65748b;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 23px;
    padding-top: 18px;
    border-top: 1px solid #edf0f5;
}

.secondary-btn {
    border: 1px solid #dce2eb;
    background: #f8f9fc;
    color: #536176;
    padding: 10px 17px;
    border-radius: 6px;
    font-size: 12px;
}

.loading {
    text-align: center;
    color: #8993a5;
    padding: 25px;
}

@media(max-width: 850px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .toolbar {
        grid-template-columns: 1fr 1fr;
    }

    .toolbar input {
        grid-column: 1 / -1;
    }
}

@media(max-width: 550px) {
    body { padding: 16px; }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .toolbar {
        grid-template-columns: 1fr;
    }

    .toolbar input {
        grid-column: auto;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .panel {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="heading">
    <div>
        <h2>Chart of Accounts</h2>
        <p>Manage the company's accounting accounts and classifications.</p>
    </div>

    <button class="primary-btn" id="addButton" type="button">
        + Add Account
    </button>
</div>

<div id="message" class="message"></div>

<div class="stats">
    <div class="stat">
        <div class="stat-label">Total Accounts</div>
        <div class="stat-value" id="totalAccounts">0</div>
    </div>

    <div class="stat">
        <div class="stat-label">Active Accounts</div>
        <div class="stat-value" id="activeAccounts">0</div>
    </div>

    <div class="stat">
        <div class="stat-label">Inactive Accounts</div>
        <div class="stat-value" id="inactiveAccounts">0</div>
    </div>

    <div class="stat">
        <div class="stat-label">Account Types</div>
        <div class="stat-value">5</div>
    </div>
</div>

<div class="panel">

    <div class="toolbar">
        <input type="search" id="searchInput"
               placeholder="Search account code or name...">

        <select id="typeFilter">
            <option value="">All Account Types</option>
            <option value="Assets">Assets</option>
            <option value="Liabilities">Liabilities</option>
            <option value="Equity">Equity</option>
            <option value="Revenue">Revenue</option>
            <option value="Expenses">Expenses</option>
        </select>

        <select id="statusFilter">
            <option value="Active">Active Only</option>
            <option value="Inactive">Inactive Only</option>
            <option value="All">All Status</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Account Code</th>
                    <th>Account Name</th>
                    <th>Account Type</th>
                    <th>Subtype</th>
                    <th>Normal Balance</th>
                    <th>Parent Account</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="accountTable">
                <tr>
                    <td colspan="8" class="loading">Loading accounts...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- ACCOUNT MODAL -->
<div class="modal" id="accountModal">
    <div class="modal-content">

        <div class="modal-header">
            <h3 id="modalTitle">Add New Account</h3>
            <button type="button" class="close-btn" id="closeModal">&times;</button>
        </div>

        <form id="accountForm">

            <div class="form-grid">

                <div class="field">
                    <label for="accountCode">Account Code *</label>
                    <input type="text" id="accountCode" required
                           placeholder="e.g. 1000">
                </div>

                <div class="field">
                    <label for="accountName">Account Name *</label>
                    <input type="text" id="accountName" required
                           placeholder="e.g. Cash">
                </div>

                <div class="field">
                    <label for="accountType">Account Type *</label>
                    <select id="accountType" required>
                        <option value="">Select Account Type</option>
                        <option value="Assets">Assets</option>
                        <option value="Liabilities">Liabilities</option>
                        <option value="Equity">Equity</option>
                        <option value="Revenue">Revenue</option>
                        <option value="Expenses">Expenses</option>
                    </select>
                </div>

                <div class="field">
                    <label for="accountSubtype">Account Subtype</label>
                    <input type="text" id="accountSubtype"
                           placeholder="e.g. Current Asset">
                </div>

                <div class="field">
                    <label for="normalBalance">Normal Balance</label>
                    <input type="text" id="normalBalance" class="readonly"
                           readonly>
                </div>

                <div class="field">
                    <label for="parentAccount">Parent Account</label>
                    <select id="parentAccount">
                        <option value="">None - Main Account</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="description">Description</label>
                    <textarea id="description"
                              placeholder="Enter account description"></textarea>
                </div>

                <div class="field">
                    <label for="accountStatus">Account Status</label>
                    <select id="accountStatus">
                        <option value="TRUE">Active</option>
                        <option value="FALSE">Inactive</option>
                    </select>
                </div>

            </div>

            <div class="modal-actions">
                <button type="button" class="secondary-btn" id="cancelButton">
                    Cancel
                </button>

                <button type="submit" class="primary-btn" id="saveButton">
                    Save Account
                </button>
            </div>

        </form>
    </div>
</div>

<script type="module">
import {
    validateLicense,
    readExcel,
    getSheet,
    addRecord,
    updateRecord,
    saveExcel
} from "../excel.js";

const session = JSON.parse(
    sessionStorage.getItem("accsystem_session") || "null"
);

if (!session) {
    window.top.location.href = "../login.html";
}

if (!session) {
    throw new Error("No active session");
}

const userAccess = session.Access || [];
const isAdmin = session.Role === "Administrator";

function hasPermission(permission) {
    if (isAdmin) return true;

    return userAccess.some(row =>
        String(row.Module).trim() === "General Ledger" &&
        (row.CanView === true || String(row.CanView).toLowerCase() === "true") &&
        (row[permission] === true || String(row[permission]).toLowerCase() === "true")
    );
}

const canView = isAdmin || userAccess.some(row =>
    String(row.Module).trim() === "General Ledger" &&
    (row.CanView === true || String(row.CanView).toLowerCase() === "true")
);

if (!canView) {
    document.body.innerHTML =
        "<h2>Access Denied</h2><p>You do not have permission to view Chart of Accounts.</p>";
    throw new Error("Insufficient permissions");
}

const canCreate = hasPermission("CanCreate");
const canEdit = hasPermission("CanEdit");
const canDelete = hasPermission("CanDelete");

const SHEET_NAME = "ChartOfAccounts";

const message = document.getElementById("message");
const accountTable = document.getElementById("accountTable");
const modal = document.getElementById("accountModal");
const form = document.getElementById("accountForm");
const saveButton = document.getElementById("saveButton");
const addButton = document.getElementById("addButton");

let accounts = [];
let editingAccountID = null;
let databaseReady = false;

addButton.style.display = canCreate ? "" : "none";

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function hideMessage() {
    message.textContent = "";
    message.className = "message";
}

function isActive(value) {
    return value === true ||
        String(value).toLowerCase() === "true" ||
        String(value) === "1";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getNormalBalance(type) {
    return ["Assets", "Expenses"].includes(type)
        ? "Debit"
        : ["Liabilities", "Equity", "Revenue"].includes(type)
            ? "Credit"
            : "";
}

function generateAccountID() {
    let highest = 0;

    accounts.forEach(account => {
        const match = String(account.AccountID || "").match(/^A(\d+)$/i);

        if (match) {
            highest = Math.max(highest, Number(match[1]));
        }
    });

    return "A" + String(highest + 1).padStart(4, "0");
}

function updateStats() {
    document.getElementById("totalAccounts").textContent =
        accounts.length;

    document.getElementById("activeAccounts").textContent =
        accounts.filter(account => isActive(account.IsActive)).length;

    document.getElementById("inactiveAccounts").textContent =
        accounts.filter(account => !isActive(account.IsActive)).length;
}

function populateParentAccounts(currentID = null) {
    const select = document.getElementById("parentAccount");

    select.innerHTML = '<option value="">None - Main Account</option>';

    accounts
        .filter(account =>
            isActive(account.IsActive) &&
            String(account.AccountID) !== String(currentID || "")
        )
        .sort((a, b) =>
            String(a.AccountCode).localeCompare(String(b.AccountCode))
        )
        .forEach(account => {
            const option = document.createElement("option");

            option.value = account.AccountCode;
            option.textContent =
                account.AccountCode + " - " + account.AccountName;

            select.appendChild(option);
        });
}

function renderAccounts() {
    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const type = document.getElementById("typeFilter").value;
    const status = document.getElementById("statusFilter").value;

    const filtered = accounts.filter(account => {
        const matchesSearch =
            String(account.AccountCode || "").toLowerCase().includes(search) ||
            String(account.AccountName || "").toLowerCase().includes(search);

        const matchesType = !type || account.AccountType === type;

        const active = isActive(account.IsActive);

        const matchesStatus =
            status === "All" ||
            (status === "Active" && active) ||
            (status === "Inactive" && !active);

        return matchesSearch && matchesType && matchesStatus;
    });

    accountTable.innerHTML = "";

    if (!filtered.length) {
        accountTable.innerHTML =
            '<tr><td colspan="8" class="empty">No accounts found.</td></tr>';
        updateStats();
        return;
    }

    filtered.sort((a, b) =>
        String(a.AccountCode).localeCompare(String(b.AccountCode))
    );

    filtered.forEach(account => {
        const tr = document.createElement("tr");

        const statusText = isActive(account.IsActive)
            ? '<span class="status-active">Active</span>'
            : '<span class="status-inactive">Inactive</span>';

        const parent = account.ParentAccount
            ? escapeHTML(account.ParentAccount)
            : "-";

        const actions = `
            ${canEdit ? `<button class="table-action" data-action="edit" data-id="${escapeHTML(account.AccountID)}">Edit</button>` : ""}
            ${canDelete ? `<button class="table-action danger" data-action="toggle" data-id="${escapeHTML(account.AccountID)}">${isActive(account.IsActive) ? "Deactivate" : "Activate"}</button>` : ""}
        `;

        tr.innerHTML = `
            <td class="account-code">${escapeHTML(account.AccountCode)}</td>
            <td>${escapeHTML(account.AccountName)}</td>
            <td><span class="type-badge">${escapeHTML(account.AccountType)}</span></td>
            <td>${escapeHTML(account.AccountSubtype || "-")}</td>
            <td>${escapeHTML(account.NormalBalance || "-")}</td>
            <td>${parent}</td>
            <td>${statusText}</td>
            <td>${actions || "-"}</td>
        `;

        accountTable.appendChild(tr);
    });

    updateStats();
}

function openModal(account = null) {
    hideMessage();
    form.reset();

    editingAccountID = account ? account.AccountID : null;

    document.getElementById("modalTitle").textContent =
        account ? "Edit Account" : "Add New Account";

    document.getElementById("accountCode").value =
        account?.AccountCode || "";

    document.getElementById("accountName").value =
        account?.AccountName || "";

    document.getElementById("accountType").value =
        account?.AccountType || "";

    document.getElementById("accountSubtype").value =
        account?.AccountSubtype || "";

    document.getElementById("normalBalance").value =
        account?.NormalBalance || "";

    document.getElementById("description").value =
        account?.Description || "";

    document.getElementById("accountStatus").value =
        account ? (isActive(account.IsActive) ? "TRUE" : "FALSE") : "TRUE";

    populateParentAccounts(account?.AccountID);

    document.getElementById("parentAccount").value =
        account?.ParentAccount || "";

    // Keep the account code fixed during editing.
    document.getElementById("accountCode").readOnly = Boolean(account);
    document.getElementById("accountCode").classList.toggle("readonly", Boolean(account));

    modal.classList.add("show");
}

function closeModal() {
    modal.classList.remove("show");
    form.reset();
    editingAccountID = null;
}

function refreshFromDatabase() {
    accounts = getSheet(SHEET_NAME) || [];
    renderAccounts();
}

document.getElementById("accountType").addEventListener("change", event => {
    document.getElementById("normalBalance").value =
        getNormalBalance(event.target.value);
});

document.getElementById("searchInput").addEventListener("input", renderAccounts);
document.getElementById("typeFilter").addEventListener("change", renderAccounts);
document.getElementById("statusFilter").addEventListener("change", renderAccounts);

addButton.addEventListener("click", () => {
    if (databaseReady && canCreate) openModal();
});

document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("cancelButton").addEventListener("click", closeModal);

modal.addEventListener("click", event => {
    if (event.target === modal) closeModal();
});

accountTable.addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const account = accounts.find(
        item => String(item.AccountID) === button.dataset.id
    );

    if (!account) return;

    if (button.dataset.action === "edit") {
        if (!canEdit) return;
        openModal(account);
        return;
    }

    if (button.dataset.action === "toggle") {
        if (!canDelete) return;

        const nextStatus = !isActive(account.IsActive);

        const confirmed = confirm(
            `${nextStatus ? "Activate" : "Deactivate"} ${account.AccountCode} - ${account.AccountName}?`
        );

        if (!confirmed) return;

        try {
            button.disabled = true;

            updateRecord(
                SHEET_NAME,
                "AccountID",
                account.AccountID,
                {
                    IsActive: nextStatus,
                    UpdatedAt: new Date().toISOString()
                }
            );

            await saveExcel();
            refreshFromDatabase();

            showMessage(
                "Account status successfully updated.",
                "success"
            );

        } catch (error) {
            showMessage(
                "Unable to update account: " + error.message,
                "error"
            );
            button.disabled = false;
        }
    }
});

form.addEventListener("submit", async event => {
    event.preventDefault();
    hideMessage();

    if (!databaseReady) {
        showMessage("Database is not ready.", "error");
        return;
    }

    const accountCode = document.getElementById("accountCode").value.trim();
    const accountName = document.getElementById("accountName").value.trim();
    const accountType = document.getElementById("accountType").value;
    const accountSubtype = document.getElementById("accountSubtype").value.trim();
    const normalBalance = getNormalBalance(accountType);
    const parentAccount = document.getElementById("parentAccount").value;
    const description = document.getElementById("description").value.trim();
    const active = document.getElementById("accountStatus").value === "TRUE";

    if (!accountCode || !accountName || !accountType) {
        showMessage("Please complete all required fields.", "error");
        return;
    }

    const duplicateCode = accounts.some(account =>
        String(account.AccountCode).trim().toLowerCase() === accountCode.toLowerCase() &&
        String(account.AccountID) !== String(editingAccountID || "")
    );

    if (duplicateCode) {
        showMessage("Account Code already exists.", "error");
        return;
    }

    if (parentAccount) {
        const parent = accounts.find(
            account => account.AccountCode === parentAccount
        );

        if (!parent || !isActive(parent.IsActive)) {
            showMessage("Selected Parent Account is not available.", "error");
            return;
        }

        if (parent.ParentAccount) {
            showMessage(
                "Only one parent level is supported in this version.",
                "error"
            );
            return;
        }

        if (parent.AccountType !== accountType) {
            showMessage(
                "Parent Account must have the same Account Type.",
                "error"
            );
            return;
        }
    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        const now = new Date().toISOString();

        if (editingAccountID) {
            if (!canEdit) throw new Error("You do not have edit permission.");

            const current = accounts.find(
                item => String(item.AccountID) === String(editingAccountID)
            );

            if (current && isActive(current.IsActive) && !active) {
                const hasActiveChildren = accounts.some(item =>
                    item.ParentAccount === current.AccountCode &&
                    isActive(item.IsActive)
                );

                if (hasActiveChildren) {
                    throw new Error(
                        "Deactivate or reassign the active subaccounts first."
                    );
                }
            }

            updateRecord(
                SHEET_NAME,
                "AccountID",
                editingAccountID,
                {
                    AccountName: accountName,
                    AccountType: accountType,
                    AccountSubtype: accountSubtype,
                    NormalBalance: normalBalance,
                    ParentAccount: parentAccount,
                    Description: description,
                    IsActive: active,
                    UpdatedAt: now
                }
            );

        } else {
            if (!canCreate) throw new Error("You do not have create permission.");

            const newAccount = {
                AccountID: generateAccountID(),
                AccountCode: accountCode,
                AccountName: accountName,
                AccountType: accountType,
                AccountSubtype: accountSubtype,
                NormalBalance: normalBalance,
                ParentAccount: parentAccount,
                Description: description,
                IsActive: active,
                CreatedAt: now,
                UpdatedAt: now
            };

            addRecord(SHEET_NAME, newAccount);
        }

        await saveExcel();
        refreshFromDatabase();
        closeModal();

        showMessage(
            editingAccountID
                ? "Account successfully updated."
                : "New account successfully created.",
            "success"
        );

    } catch (error) {
        showMessage(
            "Unable to save account: " + error.message,
            "error"
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Account";
    }
});

async function initialize() {
    try {
        const license = await validateLicense();

        if (!license.valid) {
            throw new Error(license.message || "License validation failed.");
        }

        await readExcel();

        accounts = getSheet(SHEET_NAME) || [];
        databaseReady = true;

        renderAccounts();

    } catch (error) {
        accountTable.innerHTML =
            `<tr><td colspan="8" class="empty">Unable to load accounts.</td></tr>`;

        showMessage(
            "Database connection failed: " + error.message,
            "error"
        );
    }
}

initialize();
</script>

</body>
