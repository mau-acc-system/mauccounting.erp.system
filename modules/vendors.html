<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Master | Mauccounting ERP System</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#26364e}
.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.heading h2{margin:0 0 7px;font-size:23px}.heading p{margin:0;color:#8993a5;font-size:13px}
button{cursor:pointer;font-family:inherit}.primary-btn{border:0;border-radius:6px;background:#315efb;color:white;padding:11px 18px;font-size:12px;font-weight:bold}.primary-btn:hover{background:#244bd2}
.panel,.stat{background:white;border:1px solid #e8ecf2;border-radius:10px}.panel{padding:22px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{padding:17px}.stat-label{font-size:11px;color:#8993a5}.stat-value{font-size:23px;font-weight:bold;margin-top:9px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 160px;gap:10px;margin-bottom:18px}
input,select,textarea{width:100%;min-height:40px;border:1px solid #dce2eb;border-radius:6px;padding:9px 11px;font-family:inherit;font-size:12px;outline:none;background:white;color:#26364e}
input:focus,select:focus,textarea:focus{border-color:#315efb;box-shadow:0 0 0 3px rgba(49,94,251,.08)}
.table-wrapper{width:100%;overflow-x:auto}table{width:100%;min-width:1050px;border-collapse:collapse}
thead{background:#f3f5f9}th{padding:13px 12px;text-align:left;color:#65748b;font-size:11px;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid #edf0f5;font-size:12px}tr:hover td{background:#fafbfe}
.vendor-code{font-weight:bold;color:#315efb}.status-active{color:#16834b;font-weight:bold}.status-inactive{color:#c03939;font-weight:bold}
.table-action{border:0;background:transparent;color:#315efb;font-size:11px;font-weight:bold;margin-right:9px}.table-action.danger{color:#d04444}
.empty{text-align:center;padding:35px;color:#8993a5}
.message{display:none;padding:12px 14px;border-radius:6px;font-size:12px;margin-bottom:18px}.message.success{display:block;background:#e8f8ef;color:#16834b}.message.error{display:block;background:#fff0f0;color:#c03939}
.modal{display:none;position:fixed;inset:0;background:rgba(12,24,44,.55);z-index:1000;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}
.modal-content{width:100%;max-width:760px;max-height:90vh;overflow-y:auto;background:white;border-radius:10px;padding:25px;box-shadow:0 15px 50px rgba(0,0,0,.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal-header h3{margin:0;font-size:17px}
.close-btn{border:0;background:transparent;font-size:24px;color:#8993a5}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:bold;color:#536176}textarea{min-height:75px;resize:vertical}.readonly{background:#f3f5f9;color:#65748b}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px;padding-top:18px;border-top:1px solid #edf0f5}
.secondary-btn{border:1px solid #dce2eb;background:#f8f9fc;color:#536176;padding:10px 17px;border-radius:6px;font-size:12px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){body{padding:16px}.toolbar{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:15px}}
</style>
</head>
<body>
<div class="heading">
  <div><h2>Vendor Master</h2><p>Manage suppliers and vendor account information.</p></div>
  <button class="primary-btn" id="addButton" type="button">+ Add Vendor</button>
</div>
<div id="message" class="message"></div>
<div class="stats">
  <div class="stat"><div class="stat-label">Total Vendors</div><div class="stat-value" id="totalVendors">0</div></div>
  <div class="stat"><div class="stat-label">Active Vendors</div><div class="stat-value" id="activeVendors">0</div></div>
  <div class="stat"><div class="stat-label">Inactive Vendors</div><div class="stat-value" id="inactiveVendors">0</div></div>
  <div class="stat"><div class="stat-label">Total Credit Limits</div><div class="stat-value" id="totalCredit">₱0.00</div></div>
</div>
<div class="panel">
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search vendor code, name, TIN or contact...">
    <select id="statusFilter"><option value="Active">Active Only</option><option value="Inactive">Inactive Only</option><option value="All">All Status</option></select>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Vendor Code</th><th>Vendor Name</th><th>Contact Person</th><th>TIN</th><th>Email</th><th>Phone</th><th>Payment Terms</th><th>Credit Limit</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="vendorTable"><tr><td colspan="10" class="empty">Loading vendors...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal" id="vendorModal">
 <div class="modal-content">
  <div class="modal-header"><h3 id="modalTitle">Add New Vendor</h3><button type="button" class="close-btn" id="closeModal">&times;</button></div>
  <form id="vendorForm">
   <div class="form-grid">
    <div class="field"><label for="vendorCode">Vendor Code *</label><input id="vendorCode" required maxlength="50" placeholder="e.g. SUP-001"></div>
    <div class="field"><label for="vendorName">Vendor Name *</label><input id="vendorName" required maxlength="150" placeholder="Supplier / vendor name"></div>
    <div class="field"><label for="contactPerson">Contact Person</label><input id="contactPerson" maxlength="120"></div>
    <div class="field"><label for="tin">TIN</label><input id="tin" maxlength="40" placeholder="Tax Identification Number"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="150"></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" maxlength="50"></div>
    <div class="field full"><label for="billingAddress">Billing Address</label><textarea id="billingAddress" maxlength="500"></textarea></div>
    <div class="field"><label for="paymentTerms">Payment Terms</label><select id="paymentTerms"><option value="">Select terms</option><option>COD</option><option>Due on Receipt</option><option>Net 7</option><option>Net 15</option><option>Net 30</option><option>Net 45</option><option>Net 60</option></select></div>
    <div class="field"><label for="creditLimit">Credit Limit (PHP)</label><input id="creditLimit" type="number" min="0" step="0.01" value="0"></div>
    <div class="field"><label for="vendorStatus">Vendor Status</label><select id="vendorStatus"><option value="TRUE">Active</option><option value="FALSE">Inactive</option></select></div>
   </div>
   <div class="modal-actions">
    <button type="button" class="secondary-btn" id="cancelButton">Cancel</button>
    <button type="submit" class="primary-btn" id="saveButton">Save Vendor</button>
   </div>
  </form>
 </div>
</div>

<script type="module">
import { validateLicense, readExcel, getSheet, addRecord, updateRecord, saveExcel } from "../excel.js";

const session = JSON.parse(sessionStorage.getItem("accsystem_session") || "null");
if (!session) window.top.location.href = "../login.html";
if (!session) throw new Error("No active session");

const userAccess = session.Access || [];
const isAdmin = session.Role === "Administrator";
function hasPermission(permission) {
  if (isAdmin) return true;
  return userAccess.some(row =>
    String(row.Module).trim() === "Accounts Payable" &&
    (row.CanView === true || String(row.CanView).toLowerCase() === "true") &&
    (row[permission] === true || String(row[permission]).toLowerCase() === "true")
  );
}
const canView = isAdmin || userAccess.some(row =>
  String(row.Module).trim() === "Accounts Payable" &&
  (row.CanView === true || String(row.CanView).toLowerCase() === "true")
);
if (!canView) {
  document.body.innerHTML = "<h2>Access Denied</h2><p>You do not have permission to view Vendor Master.</p>";
  throw new Error("Insufficient permissions");
}
const canCreate = hasPermission("CanCreate");
const canEdit = hasPermission("CanEdit");
const canDelete = hasPermission("CanDelete");
const SHEET_NAME = "Vendors";

const message = document.getElementById("message");
const vendorTable = document.getElementById("vendorTable");
const modal = document.getElementById("vendorModal");
const form = document.getElementById("vendorForm");
const saveButton = document.getElementById("saveButton");
const addButton = document.getElementById("addButton");

let vendors = [];
let editingVendorID = null;
let databaseReady = false;
addButton.style.display = canCreate ? "" : "none";

function showMessage(text, type) { message.textContent = text; message.className = "message " + type; }
function hideMessage() { message.textContent = ""; message.className = "message"; }
function isActive(value) { return value === true || String(value).toLowerCase() === "true" || String(value) === "1"; }
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function money(value) {
  const n = Number(value || 0);
  return new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number.isFinite(n) ? n : 0);
}
function generateVendorID() {
  let highest = 0;
  vendors.forEach(vendor => {
    const match = String(vendor.VendorID || "").match(/^V(\d+)$/i);
    if (match) highest = Math.max(highest, Number(match[1]));
  });
  return "V" + String(highest + 1).padStart(4,"0");
}
function updateStats() {
  document.getElementById("totalVendors").textContent = vendors.length;
  document.getElementById("activeVendors").textContent = vendors.filter(v => isActive(v.IsActive)).length;
  document.getElementById("inactiveVendors").textContent = vendors.filter(v => !isActive(v.IsActive)).length;
  const total = vendors.filter(v => isActive(v.IsActive)).reduce((sum,v) => sum + (Number(v.CreditLimit) || 0),0);
  document.getElementById("totalCredit").textContent = money(total);
}
function renderVendors() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const filtered = vendors.filter(v => {
    const haystack = [v.VendorCode,v.VendorName,v.ContactPerson,v.TIN,v.Email,v.Phone].join(" ").toLowerCase();
    const active = isActive(v.IsActive);
    return haystack.includes(search) && (status === "All" || (status === "Active" && active) || (status === "Inactive" && !active));
  }).sort((a,b) => String(a.VendorName || "").localeCompare(String(b.VendorName || "")));

  vendorTable.innerHTML = "";
  if (!filtered.length) {
    vendorTable.innerHTML = '<tr><td colspan="10" class="empty">No vendors found.</td></tr>';
    updateStats(); return;
  }
  filtered.forEach(v => {
    const tr = document.createElement("tr");
    const statusHTML = isActive(v.IsActive) ? '<span class="status-active">Active</span>' : '<span class="status-inactive">Inactive</span>';
    const actions = `
      ${canEdit ? `<button class="table-action" data-action="edit" data-id="${escapeHTML(v.VendorID)}">Edit</button>` : ""}
      ${canDelete ? `<button class="table-action danger" data-action="toggle" data-id="${escapeHTML(v.VendorID)}">${isActive(v.IsActive) ? "Deactivate" : "Activate"}</button>` : ""}
    `;
    tr.innerHTML = `
      <td class="vendor-code">${escapeHTML(v.VendorCode)}</td>
      <td>${escapeHTML(v.VendorName)}</td>
      <td>${escapeHTML(v.ContactPerson || "-")}</td>
      <td>${escapeHTML(v.TIN || "-")}</td>
      <td>${escapeHTML(v.Email || "-")}</td>
      <td>${escapeHTML(v.Phone || "-")}</td>
      <td>${escapeHTML(v.PaymentTerms || "-")}</td>
      <td>${money(v.CreditLimit)}</td>
      <td>${statusHTML}</td>
      <td>${actions || "-"}</td>`;
    vendorTable.appendChild(tr);
  });
  updateStats();
}
function openModal(vendor = null) {
  hideMessage(); form.reset(); editingVendorID = vendor ? vendor.VendorID : null;
  document.getElementById("modalTitle").textContent = vendor ? "Edit Vendor" : "Add New Vendor";
  document.getElementById("vendorCode").value = vendor?.VendorCode || "";
  document.getElementById("vendorName").value = vendor?.VendorName || "";
  document.getElementById("contactPerson").value = vendor?.ContactPerson || "";
  document.getElementById("tin").value = vendor?.TIN || "";
  document.getElementById("billingAddress").value = vendor?.BillingAddress || "";
  document.getElementById("email").value = vendor?.Email || "";
  document.getElementById("phone").value = vendor?.Phone || "";
  document.getElementById("paymentTerms").value = vendor?.PaymentTerms || "";
  document.getElementById("creditLimit").value = vendor?.CreditLimit ?? 0;
  document.getElementById("vendorStatus").value = vendor ? (isActive(vendor.IsActive) ? "TRUE" : "FALSE") : "TRUE";
  document.getElementById("vendorCode").readOnly = Boolean(vendor);
  document.getElementById("vendorCode").classList.toggle("readonly", Boolean(vendor));
  modal.classList.add("show");
}
function closeModal() { modal.classList.remove("show"); form.reset(); editingVendorID = null; }
function refreshFromDatabase() { vendors = getSheet(SHEET_NAME) || []; renderVendors(); }

document.getElementById("searchInput").addEventListener("input",renderVendors);
document.getElementById("statusFilter").addEventListener("change",renderVendors);
addButton.addEventListener("click",() => { if (databaseReady && canCreate) openModal(); });
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("cancelButton").addEventListener("click",closeModal);
modal.addEventListener("click",event => { if (event.target === modal) closeModal(); });

vendorTable.addEventListener("click",async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const vendor = vendors.find(v => String(v.VendorID) === button.dataset.id);
  if (!vendor) return;
  if (button.dataset.action === "edit") { if (canEdit) openModal(vendor); return; }
  if (button.dataset.action === "toggle") {
    if (!canDelete) return;
    const nextStatus = !isActive(vendor.IsActive);
    if (!confirm(`${nextStatus ? "Activate" : "Deactivate"} ${vendor.VendorCode} - ${vendor.VendorName}?`)) return;
    try {
      button.disabled = true;
      updateRecord(SHEET_NAME,"VendorID",vendor.VendorID,{IsActive:nextStatus,UpdatedAt:new Date().toISOString()});
      await saveExcel(); refreshFromDatabase();
      showMessage("Vendor status successfully updated.","success");
    } catch(error) {
      showMessage("Unable to update vendor: " + error.message,"error");
      button.disabled = false;
    }
  }
});

form.addEventListener("submit",async event => {
  event.preventDefault(); hideMessage();
  if (!databaseReady) { showMessage("Database is not ready.","error"); return; }

  const vendorCode = document.getElementById("vendorCode").value.trim();
  const vendorName = document.getElementById("vendorName").value.trim();
  const contactPerson = document.getElementById("contactPerson").value.trim();
  const tin = document.getElementById("tin").value.trim();
  const billingAddress = document.getElementById("billingAddress").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const paymentTerms = document.getElementById("paymentTerms").value;
  const creditLimit = Number(document.getElementById("creditLimit").value || 0);
  const active = document.getElementById("vendorStatus").value === "TRUE";

  if (!vendorCode || !vendorName) { showMessage("Vendor Code and Vendor Name are required.","error"); return; }
  if (!Number.isFinite(creditLimit) || creditLimit < 0) { showMessage("Credit Limit must be a valid non-negative amount.","error"); return; }
  const duplicate = vendors.some(v =>
    String(v.VendorCode || "").trim().toLowerCase() === vendorCode.toLowerCase() &&
    String(v.VendorID) !== String(editingVendorID || "")
  );
  if (duplicate) { showMessage("Vendor Code already exists.","error"); return; }

  saveButton.disabled = true; saveButton.textContent = "Saving...";
  try {
    const now = new Date().toISOString();
    const data = {VendorName:vendorName,ContactPerson:contactPerson,TIN:tin,BillingAddress:billingAddress,Email:email,Phone:phone,PaymentTerms:paymentTerms,CreditLimit:creditLimit,IsActive:active,UpdatedAt:now};
    if (editingVendorID) {
      if (!canEdit) throw new Error("You do not have edit permission.");
      updateRecord(SHEET_NAME,"VendorID",editingVendorID,data);
    } else {
      if (!canCreate) throw new Error("You do not have create permission.");
      addRecord(SHEET_NAME,{VendorID:generateVendorID(),VendorCode:vendorCode,...data,CreatedAt:now});
    }
    await saveExcel(); refreshFromDatabase(); closeModal();
    showMessage(editingVendorID ? "Vendor successfully updated." : "Vendor successfully added.","success");
  } catch(error) {
    showMessage("Unable to save vendor: " + error.message,"error");
  } finally {
    saveButton.disabled = false; saveButton.textContent = "Save Vendor";
  }
});

async function initialize() {
  try {
    const license = await validateLicense();
    if (!license.valid) throw new Error(license.message || "License validation failed.");
    await readExcel();
    vendors = getSheet(SHEET_NAME) || [];
    databaseReady = true;
    renderVendors();
  } catch(error) {
    vendorTable.innerHTML = '<tr><td colspan="10" class="empty">Unable to load vendors.</td></tr>';
    showMessage("Database connection failed: " + error.message,"error");
  }
}
initialize();
</script>
</body>
</html>
