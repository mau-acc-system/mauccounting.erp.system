<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Master | Mauccounting ERP System</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#26364e}
.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.heading h2{margin:0 0 7px;font-size:23px}.heading p{margin:0;color:#8993a5;font-size:13px}
button{cursor:pointer;font-family:inherit}.primary-btn{border:0;border-radius:6px;background:#315efb;color:white;padding:11px 18px;font-size:12px;font-weight:bold}.primary-btn:hover{background:#244bd2}
.panel,.stat{background:white;border:1px solid #e8ecf2;border-radius:10px}.panel{padding:22px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{padding:17px}.stat-label{font-size:11px;color:#8993a5}.stat-value{font-size:23px;font-weight:bold;margin-top:9px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 190px 150px;gap:10px;margin-bottom:18px}
input,select,textarea{width:100%;min-height:40px;border:1px solid #dce2eb;border-radius:6px;padding:9px 11px;font-family:inherit;font-size:12px;outline:none;background:white;color:#26364e}
input:focus,select:focus,textarea:focus{border-color:#315efb;box-shadow:0 0 0 3px rgba(49,94,251,.08)}
.table-wrapper{width:100%;overflow-x:auto}table{width:100%;min-width:1100px;border-collapse:collapse}
thead{background:#f3f5f9}th{padding:13px 12px;text-align:left;color:#65748b;font-size:11px;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid #edf0f5;font-size:12px}tr:hover td{background:#fafbfe}
.item-code{font-weight:bold;color:#315efb}.type-badge{display:inline-block;padding:5px 8px;border-radius:5px;background:#edf2ff;color:#315efb;font-size:10px;font-weight:bold}
.status-active{color:#16834b;font-weight:bold}.status-inactive{color:#c03939;font-weight:bold}
.table-action{border:0;background:transparent;color:#315efb;font-size:11px;font-weight:bold;margin-right:9px}.table-action.danger{color:#d04444}
.empty{text-align:center;padding:35px;color:#8993a5}
.message{display:none;padding:12px 14px;border-radius:6px;font-size:12px;margin-bottom:18px}.message.success{display:block;background:#e8f8ef;color:#16834b}.message.error{display:block;background:#fff0f0;color:#c03939}
.modal{display:none;position:fixed;inset:0;background:rgba(12,24,44,.55);z-index:1000;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}
.modal-content{width:100%;max-width:760px;max-height:90vh;overflow-y:auto;background:white;border-radius:10px;padding:25px;box-shadow:0 15px 50px rgba(0,0,0,.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal-header h3{margin:0;font-size:17px}
.close-btn{border:0;background:transparent;font-size:24px;color:#8993a5}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:bold;color:#536176}textarea{min-height:75px;resize:vertical}.readonly{background:#f3f5f9;color:#65748b}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px;padding-top:18px;border-top:1px solid #edf0f5}
.secondary-btn{border:1px solid #dce2eb;background:#f8f9fc;color:#536176;padding:10px 17px;border-radius:6px;font-size:12px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
@media(max-width:650px){body{padding:16px}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:15px}}
</style>
</head>
<body>
<div class="heading">
  <div><h2>Item Master</h2><p>Manage inventory items, non-inventory items, and services.</p></div>
  <button class="primary-btn" id="addButton" type="button">+ Add Item</button>
</div>
<div id="message" class="message"></div>
<div class="stats">
  <div class="stat"><div class="stat-label">Total Items</div><div class="stat-value" id="totalItems">0</div></div>
  <div class="stat"><div class="stat-label">Active Items</div><div class="stat-value" id="activeItems">0</div></div>
  <div class="stat"><div class="stat-label">Inactive Items</div><div class="stat-value" id="inactiveItems">0</div></div>
  <div class="stat"><div class="stat-label">Item Types</div><div class="stat-value" id="itemTypes">0</div></div>
</div>
<div class="panel">
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search item code, name, category or description...">
    <select id="typeFilter">
      <option value="">All Item Types</option><option value="Inventory">Inventory</option><option value="Non-Inventory">Non-Inventory</option><option value="Service">Service</option>
    </select>
    <select id="statusFilter"><option value="Active">Active Only</option><option value="Inactive">Inactive Only</option><option value="All">All Status</option></select>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Item Code</th><th>Item Name</th><th>Item Type</th><th>Category</th><th>Unit</th><th>Sales Price</th><th>Purchase Cost</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="itemTable"><tr><td colspan="9" class="empty">Loading items...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal" id="itemModal">
 <div class="modal-content">
  <div class="modal-header"><h3 id="modalTitle">Add New Item</h3><button type="button" class="close-btn" id="closeModal">&times;</button></div>
  <form id="itemForm">
   <div class="form-grid">
    <div class="field"><label for="itemCode">Item Code *</label><input id="itemCode" required maxlength="60" placeholder="e.g. ITEM-001"></div>
    <div class="field"><label for="itemName">Item Name *</label><input id="itemName" required maxlength="180" placeholder="Item or service name"></div>
    <div class="field"><label for="itemType">Item Type *</label><select id="itemType" required><option value="">Select item type</option><option value="Inventory">Inventory</option><option value="Non-Inventory">Non-Inventory</option><option value="Service">Service</option></select></div>
    <div class="field"><label for="category">Category</label><input id="category" maxlength="100" placeholder="e.g. Office Supplies"></div>
    <div class="field"><label for="unitOfMeasure">Unit of Measure</label><input id="unitOfMeasure" maxlength="40" placeholder="e.g. pcs, box, kg, hour"></div>
    <div class="field"><label for="salesPrice">Sales Price (PHP)</label><input id="salesPrice" type="number" min="0" step="0.01" value="0"></div>
    <div class="field"><label for="purchaseCost">Purchase Cost (PHP)</label><input id="purchaseCost" type="number" min="0" step="0.01" value="0"></div>
    <div class="field"><label for="itemStatus">Item Status</label><select id="itemStatus"><option value="TRUE">Active</option><option value="FALSE">Inactive</option></select></div>
    <div class="field full"><label for="description">Description</label><textarea id="description" maxlength="600" placeholder="Enter item details or service description"></textarea></div>
   </div>
   <div class="modal-actions">
    <button type="button" class="secondary-btn" id="cancelButton">Cancel</button>
    <button type="submit" class="primary-btn" id="saveButton">Save Item</button>
   </div>
  </form>
 </div>
</div>

<script type="module">
import { validateLicense, readExcel, getSheet, addRecord, updateRecord, saveExcel } from "../excel.js";

const session = JSON.parse(sessionStorage.getItem("accsystem_session") || "null");
if (!session) window.top.location.href = "../login.html";
if (!session) throw new Error("No active session");

const userAccess = session.Access || [];
const isAdmin = session.Role === "Administrator";
function hasPermission(permission) {
  if (isAdmin) return true;
  return userAccess.some(row =>
    String(row.Module).trim() === "Inventory" &&
    (row.CanView === true || String(row.CanView).toLowerCase() === "true") &&
    (row[permission] === true || String(row[permission]).toLowerCase() === "true")
  );
}
const canView = isAdmin || userAccess.some(row =>
  String(row.Module).trim() === "Inventory" &&
  (row.CanView === true || String(row.CanView).toLowerCase() === "true")
);
if (!canView) {
  document.body.innerHTML = "<h2>Access Denied</h2><p>You do not have permission to view Item Master.</p>";
  throw new Error("Insufficient permissions");
}
const canCreate = hasPermission("CanCreate");
const canEdit = hasPermission("CanEdit");
const canDelete = hasPermission("CanDelete");
const SHEET_NAME = "Items";

const message = document.getElementById("message");
const itemTable = document.getElementById("itemTable");
const modal = document.getElementById("itemModal");
const form = document.getElementById("itemForm");
const saveButton = document.getElementById("saveButton");
const addButton = document.getElementById("addButton");

let items = [];
let editingItemID = null;
let databaseReady = false;
addButton.style.display = canCreate ? "" : "none";

function showMessage(text,type){message.textContent=text;message.className="message "+type;}
function hideMessage(){message.textContent="";message.className="message";}
function isActive(value){return value===true||String(value).toLowerCase()==="true"||String(value)==="1";}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
function money(value){const n=Number(value||0);return new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number.isFinite(n)?n:0);}
function generateItemID(){
  let highest=0;
  items.forEach(item=>{const match=String(item.ItemID||"").match(/^I(\d+)$/i);if(match)highest=Math.max(highest,Number(match[1]));});
  return "I"+String(highest+1).padStart(4,"0");
}
function updateStats(){
  document.getElementById("totalItems").textContent=items.length;
  document.getElementById("activeItems").textContent=items.filter(i=>isActive(i.IsActive)).length;
  document.getElementById("inactiveItems").textContent=items.filter(i=>!isActive(i.IsActive)).length;
  document.getElementById("itemTypes").textContent=new Set(items.map(i=>i.ItemType).filter(Boolean)).size;
}
function renderItems(){
  const search=document.getElementById("searchInput").value.trim().toLowerCase();
  const type=document.getElementById("typeFilter").value;
  const status=document.getElementById("statusFilter").value;
  const filtered=items.filter(i=>{
    const haystack=[i.ItemCode,i.ItemName,i.Category,i.Description,i.UnitOfMeasure].join(" ").toLowerCase();
    const active=isActive(i.IsActive);
    return haystack.includes(search)&&(!type||i.ItemType===type)&&(status==="All"||(status==="Active"&&active)||(status==="Inactive"&&!active));
  }).sort((a,b)=>String(a.ItemName||"").localeCompare(String(b.ItemName||"")));
  itemTable.innerHTML="";
  if(!filtered.length){itemTable.innerHTML='<tr><td colspan="9" class="empty">No items found.</td></tr>';updateStats();return;}
  filtered.forEach(i=>{
    const tr=document.createElement("tr");
    const statusHTML=isActive(i.IsActive)?'<span class="status-active">Active</span>':'<span class="status-inactive">Inactive</span>';
    const actions=`
      ${canEdit?`<button class="table-action" data-action="edit" data-id="${escapeHTML(i.ItemID)}">Edit</button>`:""}
      ${canDelete?`<button class="table-action danger" data-action="toggle" data-id="${escapeHTML(i.ItemID)}">${isActive(i.IsActive)?"Deactivate":"Activate"}</button>`:""}`;
    tr.innerHTML=`
      <td class="item-code">${escapeHTML(i.ItemCode)}</td><td>${escapeHTML(i.ItemName)}</td>
      <td><span class="type-badge">${escapeHTML(i.ItemType||"-")}</span></td>
      <td>${escapeHTML(i.Category||"-")}</td><td>${escapeHTML(i.UnitOfMeasure||"-")}</td>
      <td>${money(i.SalesPrice)}</td><td>${money(i.PurchaseCost)}</td><td>${statusHTML}</td><td>${actions||"-"}</td>`;
    itemTable.appendChild(tr);
  });
  updateStats();
}
function openModal(item=null){
  hideMessage();form.reset();editingItemID=item?item.ItemID:null;
  document.getElementById("modalTitle").textContent=item?"Edit Item":"Add New Item";
  document.getElementById("itemCode").value=item?.ItemCode||"";
  document.getElementById("itemName").value=item?.ItemName||"";
  document.getElementById("itemType").value=item?.ItemType||"";
  document.getElementById("category").value=item?.Category||"";
  document.getElementById("unitOfMeasure").value=item?.UnitOfMeasure||"";
  document.getElementById("salesPrice").value=item?.SalesPrice??0;
  document.getElementById("purchaseCost").value=item?.PurchaseCost??0;
  document.getElementById("description").value=item?.Description||"";
  document.getElementById("itemStatus").value=item?(isActive(item.IsActive)?"TRUE":"FALSE"):"TRUE";
  document.getElementById("itemCode").readOnly=Boolean(item);
  document.getElementById("itemCode").classList.toggle("readonly",Boolean(item));
  modal.classList.add("show");
}
function closeModal(){modal.classList.remove("show");form.reset();editingItemID=null;}
function refreshFromDatabase(){items=getSheet(SHEET_NAME)||[];renderItems();}

document.getElementById("searchInput").addEventListener("input",renderItems);
document.getElementById("typeFilter").addEventListener("change",renderItems);
document.getElementById("statusFilter").addEventListener("change",renderItems);
addButton.addEventListener("click",()=>{if(databaseReady&&canCreate)openModal();});
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("cancelButton").addEventListener("click",closeModal);
modal.addEventListener("click",event=>{if(event.target===modal)closeModal();});

itemTable.addEventListener("click",async event=>{
  const button=event.target.closest("button[data-action]");if(!button)return;
  const item=items.find(i=>String(i.ItemID)===button.dataset.id);if(!item)return;
  if(button.dataset.action==="edit"){if(canEdit)openModal(item);return;}
  if(button.dataset.action==="toggle"){
    if(!canDelete)return;
    const nextStatus=!isActive(item.IsActive);
    if(!confirm(`${nextStatus?"Activate":"Deactivate"} ${item.ItemCode} - ${item.ItemName}?`))return;
    try{
      button.disabled=true;
      updateRecord(SHEET_NAME,"ItemID",item.ItemID,{IsActive:nextStatus,UpdatedAt:new Date().toISOString()});
      await saveExcel();refreshFromDatabase();showMessage("Item status successfully updated.","success");
    }catch(error){showMessage("Unable to update item: "+error.message,"error");button.disabled=false;}
  }
});

form.addEventListener("submit",async event=>{
  event.preventDefault();hideMessage();
  if(!databaseReady){showMessage("Database is not ready.","error");return;}
  const itemCode=document.getElementById("itemCode").value.trim();
  const itemName=document.getElementById("itemName").value.trim();
  const itemType=document.getElementById("itemType").value;
  const category=document.getElementById("category").value.trim();
  const unitOfMeasure=document.getElementById("unitOfMeasure").value.trim();
  const salesPrice=Number(document.getElementById("salesPrice").value||0);
  const purchaseCost=Number(document.getElementById("purchaseCost").value||0);
  const description=document.getElementById("description").value.trim();
  const active=document.getElementById("itemStatus").value==="TRUE";
  if(!itemCode||!itemName||!itemType){showMessage("Item Code, Item Name and Item Type are required.","error");return;}
  if(!Number.isFinite(salesPrice)||salesPrice<0||!Number.isFinite(purchaseCost)||purchaseCost<0){showMessage("Prices and costs must be valid non-negative amounts.","error");return;}
  const duplicate=items.some(i=>String(i.ItemCode||"").trim().toLowerCase()===itemCode.toLowerCase()&&String(i.ItemID)!==String(editingItemID||""));
  if(duplicate){showMessage("Item Code already exists.","error");return;}
  saveButton.disabled=true;saveButton.textContent="Saving...";
  const wasEditing=Boolean(editingItemID);
  try{
    const now=new Date().toISOString();
    const data={ItemName:itemName,Description:description,ItemType:itemType,Category:category,UnitOfMeasure:unitOfMeasure,SalesPrice:salesPrice,PurchaseCost:purchaseCost,IsActive:active,UpdatedAt:now};
    if(wasEditing){
      if(!canEdit)throw new Error("You do not have edit permission.");
      updateRecord(SHEET_NAME,"ItemID",editingItemID,data);
    }else{
      if(!canCreate)throw new Error("You do not have create permission.");
      addRecord(SHEET_NAME,{ItemID:generateItemID(),ItemCode:itemCode,...data,CreatedAt:now});
    }
    await saveExcel();refreshFromDatabase();closeModal();
    showMessage(wasEditing?"Item successfully updated.":"Item successfully added.","success");
  }catch(error){showMessage("Unable to save item: "+error.message,"error");}
  finally{saveButton.disabled=false;saveButton.textContent="Save Item";}
});

async function initialize(){
  try{
    const license=await validateLicense();
    if(!license.valid)throw new Error(license.message||"License validation failed.");
    await readExcel();
    items=getSheet(SHEET_NAME)||[];
    databaseReady=true;
    renderItems();
  }catch(error){
    itemTable.innerHTML='<tr><td colspan="9" class="empty">Unable to load items.</td></tr>';
    showMessage("Database connection failed: "+error.message,"error");
  }
}
initialize();
</script>
</body>
</html>
